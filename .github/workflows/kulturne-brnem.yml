name: Kulturně Brnem – aktualizace programu
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: kulturne-brnem-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Importovat oficiální program
        run: python collectors/kulturne_brnem.py
      - name: Uložit ověřená data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kultura/data/
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizovat kulturní program"
            git push
          fi
