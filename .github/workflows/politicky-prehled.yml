name: Politicky prehled - hourly update
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_politics.py'
      - 'scripts/test_update_politics.py'
      - '.github/workflows/politicky-prehled.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: politics-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check freshness and filtering logic
        run: python -m unittest discover -s scripts -p 'test_update_politics.py'
      - name: Fetch current articles
        run: python scripts/update_politics.py
      - name: Save latest edition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add politicky-prehled/index.html politicky-prehled/data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Obnov aktuální politický přehled'
          git pull --rebase origin main
          git push origin HEAD:main
      # GITHUB_TOKEN commits do not trigger branch-based Pages builds themselves.
      - name: Publish refreshed edition on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
